# CodeQL analysis configuration for the education system.
#
# SQL identifier construction:
# Service files build dynamic SQL (UPDATE/INSERT) by iterating over a literal
# Python tuple of allowed column names — for example
#     for col in ("name", "start_date", ...):
#         set_parts.append(f"{col} = ?")
# This is the only safe shape on this codebase: CodeQL recognises that
# `col` flows from a literal source and does NOT trace user input into
# the SQL identifier positions. Earlier patterns that built `cols` from
# `dict.keys()` of a kwargs-derived dict (and that wrapped the keys with
# a `validate_identifier()` sanitizer hoping CodeQL would honour it) were
# all flagged. The custom data-extension pack that registered
# validate_identifier as a sanitizer was never picked up by the workflow,
# so it has been removed.
#
# Excluded queries (with rationale):
#
# py/clear-text-logging-sensitive-data — this educational management system
# intentionally logs usernames and displays student/staff names, appointment
# details, and health record summaries in its CLI and GUI. CodeQL's taint
# analysis traces function parameters back to password/auth flows even when
# the logged values are display names, provider names, or appointment dates,
# producing 370+ false positives. Actual sensitive data (passwords, tokens,
# secrets) has been audited and redacted in source.
#
# py/clear-text-storage-sensitive-data — the system has explicit, user-
# initiated report-export features (demographic reports, health reports,
# statistical summaries) which write plain-text files chosen via a save-as
# dialog. Those exports are created with mode 0o600 via os.open() so the
# data is never world-readable.

name: "education-system"

query-filters:
  - exclude:
      id: py/clear-text-logging-sensitive-data
  - exclude:
      id: py/clear-text-storage-sensitive-data

paths-ignore:
  - "**/tests/**"
  - "**/test_*"
  - "**/extras/**"
  - "university-manager-main/**"
