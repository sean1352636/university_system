# CodeQL analysis configuration for the education system.
#
# The college / secondary / primary system service layers build SQL queries
# using column names from hardcoded Python tuples, validated through
# validate_identifier() which enforces ^[a-zA-Z_][a-zA-Z0-9_]*$.  CodeQL
# flags these as SQL injection because it sees f-string SQL, but user input
# never reaches the identifier positions.  See:
# education_system/shared/database/sql_safety.py
#
# A local model extension pack (.github/codeql/custom-queries/) registers
# validate_identifier() as a taint sanitizer so CodeQL recognises it as
# making the output safe for SQL identifier interpolation.
#
# py/clear-text-logging-sensitive-data is excluded because this educational
# management system intentionally logs usernames and displays student/staff
# names, appointment details, and health record summaries in its CLI and GUI.
# CodeQL's taint analysis traces function parameters back to password/auth
# flows even when the logged values are display names, provider names, or
# appointment dates — producing 370+ false positives.  Actual sensitive data
# (passwords, tokens, secrets) has been audited and redacted in source.
#
# py/clear-text-storage-sensitive-data is excluded for the same reason: the
# system has explicit, user-initiated report-export features (demographic
# reports, health reports, statistical summaries) which write plain-text
# files chosen via a save-as dialog.  Those exports are created with mode
# 0o600 via os.open() so the data is never world-readable.  CodeQL's taint
# analysis follows demographic / health column reads through the report
# generators and flags the export sinks as PII storage, but the export is
# the documented purpose of the feature.

name: "education-system"

query-filters:
  - exclude:
      id: py/clear-text-logging-sensitive-data
  - exclude:
      id: py/clear-text-storage-sensitive-data

paths-ignore:
  - "**/tests/**"
  - "**/test_*"
  - "**/extras/**"
  - "university-manager-main/**"
