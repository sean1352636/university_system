name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Lint & static analysis ────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dev tooling
        run: python -m pip install ruff mypy
      # Ruff and mypy are reported but non-blocking: the codebase carries known
      # star-import (F405) and formatting debt that Phase 6 re-enables gradually.
      # Flip continue-on-error off per-rule as that debt is paid down.
      - name: Ruff (lint — non-blocking, see Phase 6)
        run: ruff check program/education_system/
        continue-on-error: true
      - name: Ruff (format check — non-blocking, see Phase 6)
        run: ruff format --check program/education_system/
        continue-on-error: true
      - name: Mypy (non-blocking — gradual typing in progress)
        run: mypy program/education_system/ --ignore-missing-imports
        continue-on-error: true

  # ── Security scanning ─────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanners
        run: python -m pip install "bandit[toml]" pip-audit
      - name: Bandit (high severity, project config)
        run: bandit -r program/education_system/ -c pyproject.toml -lll
      - name: pip-audit (advisory — non-blocking)
        run: pip-audit -r requirements.txt
        continue-on-error: true

  # ── Fast test suite on every supported Python version ─────────────────────
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System packages (Tkinter for GUI-import tests)
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
      # No explicit paths: pyproject's testpaths = ["program/tests"] covers the
      # single post-migration tree, which also picks up launcher/, migrations/
      # and tools/ — dirs the old per-system path list silently missed.
      - name: Run fast suite (all five systems, excludes slow/gui)
        run: pytest -m "not slow and not gui" --timeout=60

  # ── Per-system guard: fail if ANY of the five systems has no runnable tests ─
  # Enforces "do not let main report success when a system wasn't tested".
  systems:
    name: System tests (${{ matrix.system }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: platform,   path: program/tests/platform }
          - { system: nursery,    path: program/tests/systems/nursery }
          - { system: primary,    path: program/tests/systems/primary }
          - { system: secondary,  path: program/tests/systems/secondary }
          - { system: sixth-form, path: program/tests/systems/sixth_form }
          - { system: university, path: program/tests/systems/university }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System packages (Tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Fail if this system collects zero tests
        run: |
          pytest ${{ matrix.path }} --collect-only -q -m "not slow and not gui" \
            | tee /tmp/collect.txt
          if grep -qE "no tests ran|0 tests collected|ERROR" /tmp/collect.txt; then
            echo "::error::System '${{ matrix.system }}' collected no tests"; exit 1
          fi
      - name: Run this system's fast tests
        run: pytest ${{ matrix.path }} -m "not slow and not gui" --timeout=60

  # ── Build the package and smoke-test the installed console command ────────
  build:
    name: Build & install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install built wheel and run console-command smoke
        run: |
          python -m venv /tmp/smoke
          # --no-deps keeps the smoke fast; `--help` only needs the stdlib.
          /tmp/smoke/bin/pip install --no-deps dist/*.whl
          /tmp/smoke/bin/education-system --help

  # ── Documentation link check (relative/local links, deterministic) ────────
  docs-links:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Scoped to the top-level user-facing docs, which are kept link-clean.
      # The wider docs/ tree carries pre-existing broken relative links (tracked
      # under the Documentation phase) and is not gated yet.
      - name: Check links in the key docs (offline mode, local links only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md
          fail: true

  # ── Slow / integration / performance suite (not on every PR) ──────────────
  slow-tests:
    name: Slow & integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System packages (Tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Run slow + integration tests
        run: pytest program/tests/platform program/tests/systems/university -m "slow or integration" --timeout=180
        continue-on-error: true

  # ── Single required gate: green only if lint/security/tests/systems/build/docs pass ─
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [lint, security, test, systems, build, docs-links]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          results='${{ needs.lint.result }} ${{ needs.security.result }} ${{ needs.test.result }} ${{ needs.systems.result }} ${{ needs.build.result }} ${{ needs.docs-links.result }}'
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required CI job did not succeed"; exit 1
            fi
          done
          echo "All required CI jobs passed."
