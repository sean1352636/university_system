name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Lint & static analysis ────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install dev tooling
        run: python -m pip install ruff mypy
      # Ruff and mypy are reported but non-blocking: the codebase carries known
      # star-import (F405) and formatting debt that Phase 6 re-enables gradually.
      # Flip continue-on-error off per-rule as that debt is paid down.
      - name: Ruff (lint — non-blocking, see Phase 6)
        run: ruff check src/education_system/
        continue-on-error: true
      - name: Ruff (format check — non-blocking, see Phase 6)
        run: ruff format --check src/education_system/
        continue-on-error: true
      - name: Mypy (non-blocking — gradual typing in progress)
        run: mypy src/education_system/
        continue-on-error: true

  core-quality:
    name: Modernised core quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and quality dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Architecture and complexity
        run: python tools/university/check_architecture.py
      - name: Ruff core
        run: >-
          ruff check
          src/education_system/systems/university/services/operations.py
          src/education_system/systems/university/services/events
          src/education_system/systems/university/infrastructure/database/schema_version.py
          src/education_system/platform/governance/security/secrets.py
          src/education_system/platform/governance/security/sensitive_access.py
      - name: Mypy core
        run: >-
          mypy --config-file pyproject.toml
          src/education_system/systems/university/services/operations.py
          src/education_system/systems/university/services/events
          src/education_system/systems/university/infrastructure/database/schema_version.py
          src/education_system/platform/governance/security/secrets.py
      - name: University core coverage
        run: make coverage-university-core
      - name: API, migration, plugin and accessibility contracts
        run: >-
          CI_STRICT_SKIPS=1 pytest
          tests/systems/university/contracts
          tests/migrations/test_university_canonical_migration.py
          tests/migrations/test_university_transactional_outbox_migration.py
          tests/migrations/test_admissions_policy_consumer_migration.py
          tests/systems/university/application/test_institutional_operations.py
          tests/migrations/test_institutional_operations_migration.py
          -n 0 --timeout=120

  profile-supply-chain:
    name: SBOM and scan (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - core
          - desktop
          - analytics
          - ai
          - documents
          - commerce
          - integrations
          - campus-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build profile environment
        run: |
          python -m pip install build cyclonedx-bom pip-audit
          python -m build
          python -m venv /tmp/profile
          /tmp/profile/bin/pip install ".[${{ matrix.profile }}]"
      - name: Prove minimal core boundaries
        if: matrix.profile == 'core'
        run: |
          /tmp/profile/bin/python tools/university/smoke_minimal_core.py
          ! /tmp/profile/bin/pip freeze | grep -Ei 'numpy|pandas|scipy|matplotlib|tkcalendar|ttkthemes'
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment /tmp/profile/bin/python -o "${{ matrix.profile }}-sbom.json"
      - name: Scan installed profile
        run: pip-audit --python /tmp/profile/bin/python --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: university-${{ matrix.profile }}-sbom
          path: ${{ matrix.profile }}-sbom.json

  browser-quality:
    name: Accessibility and browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -e ".[test]" pytest-playwright axe-playwright-python
          playwright install --with-deps chromium
      - name: Run browser and WCAG checks
        run: pytest tests/systems/university/browser -n 0 --browser chromium

  # ── Security scanning ─────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanners
        run: |
          python -m pip install "bandit[toml]" pip-audit pytest pytest-xdist pytest-timeout
          python -m pip install -r requirements.lock
      - name: Bandit (high severity, project config)
        run: bandit -r src/education_system/ -c pyproject.toml -lll
      # Medium-severity findings are reported as annotations so they are
      # visible without failing the build while the existing backlog is paid
      # down. The -lll gate above stays blocking.
      - name: Bandit (medium severity — annotations only)
        run: bandit -r src/education_system/ -c pyproject.toml -ll -f txt
        continue-on-error: true
      # Blocking. A known-vulnerable pinned dependency is a release blocker,
      # not an advisory note: the previous continue-on-error meant every CVE
      # in the tree was reported green.
      - name: pip-audit (blocking)
        run: pip-audit --requirement requirements.lock --strict --progress-spinner off
      - name: Security and authentication tests
        run: >-
          pytest tests/systems/university/infrastructure/security
          tests/systems/university/infrastructure/auth
          -n 0 --timeout=120
      # Independent, cross-cutting security suite (authz/tenant/CSRF/SSRF/
      # upload/backup/audit/secret-leakage). Also the release gate in
      # release.yml, so it must be green on every push to main.
      - name: Independent security suite
        env:
          APP_ENV: test
          EDU_DEV_SEED: "true"
        run: pytest tests/security -n 0 --timeout=120

  # ── Supply chain: build integrity, pinning, hash-verified install ─────────
  supply-chain:
    name: Supply chain integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Fast, offline, no dependencies: catches an unpinned requirement, a
      # stale or unhashed lock, or a setup.py reappearing, in a few seconds.
      - name: Static supply-chain checks
        run: python tools/supply_chain_check.py
      # Proves the committed hashes actually match what the index serves. If
      # an artifact were swapped upstream, this is the step that fails.
      - name: Hash-verified install of the runtime lock
        run: |
          python -m venv /tmp/locked
          /tmp/locked/bin/pip install --require-hashes --no-deps -r requirements.lock
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      # A build that reaches the network at install time can execute code on
      # every installing machine. The package is declarative, so installing
      # the built wheel with no index configured must still succeed.
      - name: Prove the wheel installs with no network access to an index
        run: |
          python -m venv /tmp/offline
          /tmp/offline/bin/pip install --no-deps --no-index --no-build-isolation dist/*.whl
          /tmp/offline/bin/python -c "import education_system; print('import ok')"
      - name: Generate CycloneDX SBOM for the locked runtime
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py environment /tmp/locked/bin/python -o runtime-sbom.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-sbom
          path: runtime-sbom.json

  # ── Container image build and vulnerability scan ──────────────────────────
  container-scan:
    name: Container build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t education-system:ci -f docker/Dockerfile .
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: education-system:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload scan results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
      # Blocking: a CRITICAL with a fix available must not ship in an image.
      - name: Fail on fixable critical findings
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: education-system:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ── Fast test suite on every supported Python version ─────────────────────
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      CI_STRICT_SKIPS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: System packages (Tkinter for GUI-import tests)
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      # No explicit paths: pyproject's testpaths = ["tests"] covers the
      # single post-migration tree, which also picks up launcher/, migrations/
      # and tools/ — dirs the old per-system path list silently missed.
      - name: Run fast suite (all five systems, excludes slow/gui)
        run: pytest -m "not slow and not gui" --timeout=60

  # Exercise path, subprocess, database and non-display GUI-adjacent code on
  # every supported desktop OS.  Linux remains the full-suite environment;
  # this job catches separator, environment and process API assumptions.
  cross-platform-smoke:
    name: Cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Run cross-platform filesystem, subprocess and localization tests
        run: >-
          pytest
          tests/systems/university/infrastructure/core
          tests/systems/university/infrastructure/database
          tests/systems/university/infrastructure/utils
          tests/systems/university/integration
          -m "not gui and not slow" -n 0 --timeout=120

  # GUI tests need a display and must run serially: parallel Tk workers sharing
  # one display produce intermittent focus, clipboard and window-lifecycle errors.
  university-gui:
    name: University GUI tests
    runs-on: ubuntu-latest
    env:
      CI_STRICT_SKIPS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install Tkinter and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Run all university GUI tests
        run: >-
          xvfb-run -a
          pytest tests/systems/university
          -o addopts=''
          -m gui -n 0 --timeout=180
          --strict-markers --strict-config
          --import-mode=importlib
          --cov=src/education_system/systems/university/interfaces/gui
          --cov-branch
          --cov-report=xml:coverage-university-gui.xml
          --cov-fail-under=0.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: university-gui-coverage
          path: coverage-university-gui.xml

  university-coverage:
    name: Whole university coverage
    runs-on: ubuntu-latest
    env:
      CI_STRICT_SKIPS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Enforce whole-university coverage floor
        run: make coverage-university
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: university-coverage
          path: coverage-university.xml

  # ── Per-system guard: fail if ANY of the five systems has no runnable tests ─
  # Enforces "do not let main report success when a system wasn't tested".
  systems:
    name: System tests (${{ matrix.system }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: platform,   path: tests/platform }
          - { system: nursery,    path: tests/systems/nursery }
          - { system: primary,    path: tests/systems/primary }
          - { system: secondary,  path: tests/systems/secondary }
          - { system: sixth-form, path: tests/systems/sixth_form }
          - { system: university, path: tests/systems/university }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: System packages (Tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Fail if this system collects zero tests
        run: |
          pytest ${{ matrix.path }} --collect-only -q -m "not slow and not gui" \
            | tee /tmp/collect.txt
          if grep -qE "no tests ran|0 tests collected|ERROR" /tmp/collect.txt; then
            echo "::error::System '${{ matrix.system }}' collected no tests"; exit 1
          fi
      - name: Run this system's fast tests
        run: pytest ${{ matrix.path }} -m "not slow and not gui" --timeout=60

  # ── Build the package and smoke-test the installed console command ────────
  build:
    name: Build & install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install built wheel and run console-command smoke
        run: |
          python -m venv /tmp/smoke
          # --no-deps keeps the smoke fast; `--help` only needs the stdlib.
          /tmp/smoke/bin/pip install --no-deps dist/*.whl
          /tmp/smoke/bin/education-system --help

  # ── Documentation link check (relative/local links, deterministic) ────────
  docs-links:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scoped to the top-level user-facing docs, which are kept link-clean.
      # The wider docs/ tree carries pre-existing broken relative links (tracked
      # under the Documentation phase) and is not gated yet.
      - name: Check links in the key docs (offline mode, local links only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md
          fail: true

  # ── Slow / integration / performance suite ───────────────────────────────
  slow-tests:
    name: Slow & integration tests
    runs-on: ubuntu-latest
    env:
      CI_STRICT_SKIPS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install Tkinter and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Run slow + integration tests
        run: >-
          xvfb-run -a
          pytest tests/platform tests/systems/university
          -m "slow or integration" -n 0 --timeout=180
      - name: Enforce performance regression budgets
        run: >-
          xvfb-run -a
          pytest tests/systems/university/integration/test_performance_benchmarks.py
          -m performance -n 0 --timeout=180

  # ── Single required gate: green only if every required job passes ─────────
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [lint, core-quality, profile-supply-chain, security, supply-chain, container-scan, test, university-gui, university-coverage, systems, build, docs-links, slow-tests]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          results='${{ needs.lint.result }} ${{ needs.core-quality.result }} ${{ needs.profile-supply-chain.result }} ${{ needs.security.result }} ${{ needs.supply-chain.result }} ${{ needs.container-scan.result }} ${{ needs.test.result }} ${{ needs.university-gui.result }} ${{ needs.university-coverage.result }} ${{ needs.systems.result }} ${{ needs.build.result }} ${{ needs.docs-links.result }} ${{ needs.slow-tests.result }}'
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required CI job did not succeed"; exit 1
            fi
          done
          echo "All required CI jobs passed."
