name: Performance Tests

on:
  schedule:
    # Run every Sunday at 02:00 UTC (off-peak)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      users:
        description: 'Number of concurrent Locust users'
        required: false
        default: '10'
      run_time:
        description: 'Load test duration (e.g. 30s, 2m)'
        required: false
        default: '30s'
      host:
        description: 'Target host URL'
        required: false
        default: 'http://localhost:5000'

jobs:
  # ---------------------------------------------------------------------------
  # SQLite benchmark — runs standalone, no server needed
  # ---------------------------------------------------------------------------
  benchmark-db:
    name: SQLite Benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SQLite benchmark
        run: |
          mkdir -p results
          python tests/performance/benchmark_db.py | tee results/benchmark_db.txt
        # Allow the step to pass even if thresholds are breached (informational)
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-db-results
          path: results/benchmark_db.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # API load test — starts the college API server, then hammers it with Locust
  # ---------------------------------------------------------------------------
  load-test:
    name: API Load Test
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      # Point all systems at the same SQLite file for CI simplicity
      COLLEGE_DB_PATH: /tmp/ci_college.db
      AUTH_DB_PATH:    /tmp/ci_auth.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed database
        run: |
          python run.py --seed || true
        # Seeding may exit non-zero in CI if GUI is unavailable — tolerated

      - name: Start API server in background
        run: |
          python -m education_system.shared.api.college.api_server \
            --host 0.0.0.0 --port 5000 &
          echo "Server PID: $!"
          # Wait for the server to become healthy (up to 30 s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "Server is up after ${i}s"
              break
            fi
            echo "Waiting for server... (${i}s)"
            sleep 1
          done
          curl -sf http://localhost:5000/api/health || (echo "Server did not start" && exit 1)

      - name: Run Locust headless load test
        run: |
          mkdir -p results
          USERS="${{ github.event.inputs.users || '10' }}"
          RUN_TIME="${{ github.event.inputs.run_time || '30s' }}"
          HOST="${{ github.event.inputs.host || 'http://localhost:5000' }}"

          locust \
            -f tests/performance/locustfile.py \
            --headless \
            -u "${USERS}" \
            -r 2 \
            --run-time "${RUN_TIME}" \
            --host "${HOST}" \
            --csv results/locust_stats \
            --csv-full-history \
            --html results/locust_report.html \
            --only-summary \
            2>&1 | tee results/locust_output.txt

      - name: Check p95 latency threshold
        run: |
          python - <<'PYEOF'
          import csv
          import sys
          import os

          stats_file = "results/locust_stats_stats.csv"
          if not os.path.exists(stats_file):
              # Try alternate filename Locust sometimes uses
              stats_file = "results/locust_stats.csv"

          if not os.path.exists(stats_file):
              print("WARNING: No Locust CSV stats file found — skipping threshold check.")
              sys.exit(0)

          THRESHOLD_MS = 2000
          failures = []

          with open(stats_file, newline="") as f:
              reader = csv.DictReader(f)
              for row in reader:
                  name = row.get("Name", "")
                  if name in ("Aggregated", ""):
                      continue
                  try:
                      p95 = float(row.get("95%", row.get("95th Percentile", 0) or 0))
                  except (ValueError, TypeError):
                      continue
                  if p95 > THRESHOLD_MS:
                      failures.append((name, p95))
                      print(f"FAIL: {name!r} p95={p95:.0f}ms > {THRESHOLD_MS}ms")
                  else:
                      print(f"PASS: {name!r} p95={p95:.0f}ms")

          if failures:
              print(f"\n{len(failures)} endpoint(s) exceeded the {THRESHOLD_MS}ms p95 threshold.")
              sys.exit(1)
          else:
              print(f"\nAll sampled endpoints are within the {THRESHOLD_MS}ms p95 threshold.")
          PYEOF

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: |
            results/locust_output.txt
            results/locust_stats*.csv
            results/locust_report.html
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Summary job — post a simple comment or annotation
  # ---------------------------------------------------------------------------
  summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [benchmark-db, load-test]
    if: always()

    steps:
      - name: Report outcome
        run: |
          echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SQLite Benchmark | ${{ needs.benchmark-db.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Load Test    | ${{ needs.load-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artefacts (CSV stats, HTML report) are attached to this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "Retention: 30 days." >> $GITHUB_STEP_SUMMARY
