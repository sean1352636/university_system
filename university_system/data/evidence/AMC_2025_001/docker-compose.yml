# University Management System - Docker Compose Configuration
# Supports multiple deployment configurations

version: '3.8'

services:
  # Main application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: university-system-app
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-False}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-university_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - app_backups:/app/backups
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - university-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL database (optional - can use SQLite instead)
  db:
    image: postgres:15-alpine
    container_name: university-system-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-university_system}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - university-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-university_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis cache (optional - for session management and caching)
  redis:
    image: redis:7-alpine
    container_name: university-system-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - university-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Email scheduler service
  email-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: university-system-email-scheduler
    restart: unless-stopped
    command: ["python", "-m", "university_system.infrastructure.email.email_scheduler"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-university_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - university-network

# Named volumes for persistent data
volumes:
  app_data:
    driver: local
  app_logs:
    driver: local
  app_backups:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

# Network configuration
networks:
  university-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
