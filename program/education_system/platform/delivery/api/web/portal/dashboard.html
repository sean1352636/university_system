<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Education System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/assets/portal.css">
</head>
<body>
  <div id="topbar"></div>

  <main class="container">
    <section class="page-header">
      <div>
        <h1 id="title">Dashboard</h1>
        <p id="subtitle" class="muted">Loading...</p>
      </div>
      <div class="row">
        <label for="system-select" class="muted" style="font-size:.85rem;">System:</label>
        <select id="system-select" class="field" style="width:auto; padding:.45rem .6rem;"></select>
      </div>
    </section>

    <section id="kpis" class="grid grid-4" style="margin-bottom:1.25rem;"></section>

    <section class="grid grid-2">
      <div class="card">
        <h2>Attendance breakdown</h2>
        <div id="attendance-box">
          <div class="empty-state muted">
            <div class="spinner" style="margin: 0 auto .5rem;"></div>
            Loading attendance…
          </div>
        </div>
      </div>
      <div class="card">
        <h2>Recent enrollments</h2>
        <div id="enrollments-box">
          <div class="empty-state muted">
            <div class="spinner" style="margin: 0 auto .5rem;"></div>
            Loading enrollments…
          </div>
        </div>
      </div>
    </section>

    <section style="margin-top:1.25rem;">
      <div class="card">
        <div class="row" style="justify-content:space-between; align-items:baseline;">
          <h2>Modules</h2>
          <input id="module-filter" class="field" placeholder="Filter modules…"
                 style="width:auto; padding:.4rem .6rem; font-size:.85rem;">
        </div>
        <div id="modules-grid" class="module-grid" style="margin-top:.75rem;">
          <div class="empty-state muted">
            <div class="spinner" style="margin:0 auto .5rem;"></div>
            Loading modules…
          </div>
        </div>
      </div>
    </section>

    <section style="margin-top:1.25rem;">
      <div class="card">
        <h2>Your systems</h2>
        <div id="user-systems" class="row" style="margin-top:.5rem;"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">Education System · Dashboard</footer>

  <script src="/portal/assets/portal.js"></script>
  <script>
    (function () {
      if (!EduPortal.requireAuth()) return;

      const user = EduPortal.getUser();
      const accessibleSystems = (user.systems || []).map(s => s.system_key);

      // Pick an active system: ?system= param > saved > first accessible
      let currentSystem = EduPortal.qs("system") || EduPortal.getActiveSystem();
      if (!currentSystem || !accessibleSystems.includes(currentSystem)) {
        currentSystem = accessibleSystems[0];
      }

      if (!currentSystem) {
        document.querySelector("main").innerHTML = `
          <div class="card empty-state">
            <div class="emoji">\uD83D\uDEAB</div>
            <h2>No system access</h2>
            <p class="muted">Your account has no system access yet. Ask your administrator to grant access.</p>
          </div>`;
        EduPortal.renderTopbar("dashboard");
        return;
      }

      EduPortal.setActiveSystem(currentSystem);
      EduPortal.renderTopbar("dashboard");

      // Populate system selector (only systems this user can access)
      const select = document.getElementById("system-select");
      select.innerHTML = accessibleSystems.map(k => {
        const meta = EduPortal.getSystemMeta(k);
        return `<option value="${k}" ${k === currentSystem ? "selected" : ""}>${meta.label}</option>`;
      }).join("");
      select.addEventListener("change", () => {
        const v = select.value;
        EduPortal.setActiveSystem(v);
        location.href = "/portal/dashboard.html?system=" + v;
      });

      // Render user's system chips (all 4, with a tag showing role)
      const userSystemsBox = document.getElementById("user-systems");
      userSystemsBox.innerHTML = EduPortal.SYSTEMS.map(s => {
        const entry = (user.systems || []).find(x => x.system_key === s.key);
        if (entry) {
          return `<a href="/portal/dashboard.html?system=${s.key}" class="tag tag-${s.key}">${s.label} · ${entry.role || "member"}</a>`;
        }
        return `<span class="tag" title="No access">${s.label} · locked</span>`;
      }).join(" ");

      // Head
      const meta = EduPortal.getSystemMeta(currentSystem);
      document.getElementById("title").innerHTML = `${meta.emoji} ${meta.label} Dashboard`;
      document.getElementById("subtitle").textContent = meta.tagline;

      // Module navigation — one button per API module for this system
      const modGrid = document.getElementById("modules-grid");
      const modFilter = document.getElementById("module-filter");
      let allModules = [];
      function renderModules(list) {
        if (!list.length) {
          modGrid.innerHTML = `<p class="muted">No modules available for this system yet.</p>`;
          return;
        }
        modGrid.innerHTML = list.map(m => `
          <a class="module-btn tag-${currentSystem}"
             href="/portal/module.html?system=${currentSystem}&module=${encodeURIComponent(m.key)}">
            ${EduPortal.escapeHtml(m.label)}
          </a>`).join("");
      }
      EduPortal.apiFetch("/web/modules/" + currentSystem)
        .then(res => {
          allModules = res.modules || [];
          renderModules(allModules);
          modFilter.addEventListener("input", () => {
            const q = modFilter.value.trim().toLowerCase();
            renderModules(allModules.filter(m => m.label.toLowerCase().includes(q)));
          });
        })
        .catch(() => { modGrid.innerHTML = `<p class="muted">Could not load modules.</p>`; });

      // Load dashboard data
      EduPortal.apiFetch("/web/dashboard/" + currentSystem)
        .then(render)
        .catch(err => {
          document.getElementById("kpis").innerHTML = `
            <div class="card empty-state" style="grid-column:1/-1;">
              <div class="emoji">\u26A0\uFE0F</div>
              <h2>Could not load dashboard</h2>
              <p class="muted">${EduPortal.escapeHtml(err.message || "Unknown error")}</p>
            </div>`;
          document.getElementById("attendance-box").innerHTML = "";
          document.getElementById("enrollments-box").innerHTML = "";
        });

      function render(data) {
        // KPIs
        const kpis = [
          { label: "Students",    value: data.total_students ?? 0 },
          { label: "Courses",     value: data.total_courses ?? 0 },
          { label: "Attendance",  value: data.attendance_rate != null ? data.attendance_rate + "%" : "—" },
          { label: "Grade records", value: data.total_grades ?? 0 },
        ];
        document.getElementById("kpis").innerHTML = kpis.map(k => `
          <div class="kpi">
            <div class="label">${k.label}</div>
            <div class="value">${EduPortal.escapeHtml(String(k.value))}</div>
          </div>`).join("");

        // Attendance breakdown
        const breakdown = data.attendance_breakdown || {};
        const total = Object.values(breakdown).reduce((a, b) => a + (b || 0), 0);
        const attBox = document.getElementById("attendance-box");
        if (!total) {
          attBox.innerHTML = `<p class="muted">No attendance records yet.</p>`;
        } else {
          attBox.innerHTML = `
            <div class="table-wrap">
              <table>
                <thead><tr><th>Status</th><th>Count</th><th>Share</th></tr></thead>
                <tbody>
                  ${Object.entries(breakdown).map(([status, count]) => `
                    <tr>
                      <td>${EduPortal.escapeHtml(status)}</td>
                      <td>${count}</td>
                      <td>${total ? ((count / total) * 100).toFixed(1) + "%" : "—"}</td>
                    </tr>`).join("")}
                </tbody>
              </table>
            </div>`;
        }

        // Recent enrollments
        const rows = data.recent_enrollments || [];
        const enrollBox = document.getElementById("enrollments-box");
        if (!rows.length) {
          enrollBox.innerHTML = `<p class="muted">No recent enrollments.</p>`;
        } else {
          const keys = Object.keys(rows[0]).slice(0, 5);
          enrollBox.innerHTML = `
            <div class="table-wrap">
              <table>
                <thead><tr>${keys.map(k => `<th>${EduPortal.escapeHtml(k)}</th>`).join("")}</tr></thead>
                <tbody>
                  ${rows.map(r => `
                    <tr>${keys.map(k => `<td>${EduPortal.escapeHtml(String(r[k] ?? ""))}</td>`).join("")}</tr>
                  `).join("")}
                </tbody>
              </table>
            </div>`;
        }
      }
    })();
  </script>
</body>
</html>
