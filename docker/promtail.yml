# Promtail configuration — ships JSON log files to Loki
# Place this file at docker/promtail.yml (referenced by docker-compose.monitoring.yml)

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: education_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: education_system
          __path__: /var/log/education/**/*.log
    pipeline_stages:
      # Parse the JSON emitted by JSONFormatter so Loki can index key fields
      - json:
          expressions:
            level: level
            logger: logger
            request_id: request_id
            system: system
            user_id: user_id
      - labels:
          level:
          logger:
          system:
      - timestamp:
          source: "@timestamp"
          format: RFC3339Nano
          action_on_failure: skip
