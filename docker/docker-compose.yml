# Education Management System - Docker Compose
services:
  nginx:
    image: nginx:alpine
    container_name: education-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: education-system
    # nginx proxies to app:5000, so this runs the API, not the image's default
    # CLI. For the CLI: docker compose run --rm app python -m education_system --cli
    command:
      - gunicorn
      - --bind=0.0.0.0:5000
      - --workers=2
      - --threads=4
      - education_system.platform.delivery.api.unified_server:create_unified_app()
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-False}
      # Passed through from the host or .env when set. Required when APP_ENV=production.
      - API_SECRET_KEY
      - JWT_SECRET_KEY
      - CREDENTIAL_SIGNING_KEY
      - API_CORS_ORIGINS
    volumes:
      # Databases, logs, uploads and backups all live under var/.
      - app-var:/app/var
    expose:
      - "5000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health/live')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  app-var:
