# Monitoring stack for local development — Loki + Grafana + Prometheus
#
# Usage:
#   docker compose -f docker/docker-compose.monitoring.yml up -d
#
# Dashboards:
#   Grafana:    http://localhost:3000  (admin / admin)
#   Prometheus: http://localhost:9090
#
# The education system API must be reachable from the Docker network.
# By default Prometheus scrapes http://host.docker.internal:5000/metrics.
# Override with:
#   APP_HOST=192.168.1.42 APP_PORT=5000 docker compose ... up -d

services:

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: edu-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

  # ── Loki (log aggregation) ────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.7
    container_name: edu-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # ── Promtail (log shipper: tails app log files → Loki) ───────────────────
  promtail:
    image: grafana/promtail:2.9.7
    container_name: edu-promtail
    restart: unless-stopped
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      # Mount the host log directory so Promtail can tail JSON log files.
      # Adjust this path to match where your app writes logs.
      - ${LOG_DIR:-../education_system/shared/data/logs}:/var/log/education:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: edu-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
