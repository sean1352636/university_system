# Education Management System - Docker Compose
services:
  nginx:
    image: nginx:alpine
    container_name: education-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    container_name: education-system
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-False}
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    expose:
      - "5000"
    stdin_open: true
    tty: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health/live')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  app-data:
  app-logs:
