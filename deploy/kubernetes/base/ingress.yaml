apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: education-api
  namespace: education-system
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: [education.example.org]
      secretName: education-tls
  rules:
    - host: education.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: education-api, port: {name: http}}
