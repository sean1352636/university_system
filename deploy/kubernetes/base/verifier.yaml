apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-verifier
  namespace: education-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: credential-verifier}
  template:
    metadata:
      labels: {app: credential-verifier}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: verifier
          image: education-system:latest
          command: [gunicorn]
          args: ["--bind=0.0.0.0:5010", "--workers=2", "education_system.systems.university.services.credential_verifier:create_app()"]
          envFrom:
            - configMapRef: {name: education-config}
            - secretRef: {name: education-secrets}
          ports:
            - {name: http, containerPort: 5010}
          readinessProbe: {httpGet: {path: /health/live, port: http}}
          livenessProbe: {httpGet: {path: /health/live, port: http}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /app/program/var, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: education-data}
---
apiVersion: v1
kind: Service
metadata:
  name: credential-verifier
  namespace: education-system
spec:
  selector: {app: credential-verifier}
  ports:
    - {name: http, port: 80, targetPort: http}
