<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Education System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal/assets/portal.css">
</head>
<body class="auth-shell">
  <div class="auth-card">
    <div class="logo">
      <div class="icon">E</div>
      <h1>Sign in</h1>
      <p class="sub">One account, every system.</p>
    </div>

    <div id="alert" class="alert alert-error hidden"></div>

    <!-- Credentials form -->
    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
        </div>
      </div>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>

    <!-- MFA form (hidden until the server demands a code) -->
    <form id="mfa-form" class="hidden" autocomplete="off">
      <div class="alert alert-info">Enter the 6-digit code from your authenticator app.</div>
      <div class="field">
        <label for="mfa-code">MFA code</label>
        <input id="mfa-code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}"
               maxlength="6" autocomplete="one-time-code" required>
      </div>
      <button type="submit" id="mfa-submit">Verify</button>
    </form>

    <!-- System chooser (shown when an account has access to more than one system) -->
    <div id="system-picker" class="hidden">
      <div class="alert alert-info">You have access to more than one system. Choose where to go.</div>
      <div id="system-list" class="system-list"></div>
    </div>

    <div class="hint">
      Default dev creds: <code>superadmin</code> / <code>SuperAdmin@123</code><br>
      <a href="/portal/">← Back to portal home</a>
    </div>
  </div>

  <script src="/portal/assets/portal.js"></script>
  <script>
    (function () {
      const form = document.getElementById("login-form");
      const mfaForm = document.getElementById("mfa-form");
      const btn = document.getElementById("submit-btn");
      const alertBox = document.getElementById("alert");
      let mfaToken = null;

      function showError(msg) {
        alertBox.textContent = msg;
        alertBox.classList.remove("hidden");
      }
      function clearError() { alertBox.classList.add("hidden"); alertBox.textContent = ""; }

      function goToSystem(key) {
        EduPortal.setActiveSystem(key);
        location.href = EduPortal.routeForSystem(key);
      }

      function showSystemPicker(systems) {
        // Hide the credential/MFA forms, reveal the chooser.
        form.classList.add("hidden");
        mfaForm.classList.add("hidden");
        const picker = document.getElementById("system-picker");
        const list = document.getElementById("system-list");
        list.innerHTML = systems.map(s => {
          const meta = EduPortal.getSystemMeta(s.system_key);
          const role = s.role || "member";
          return `<button type="button" class="system-option" data-system="${meta.key}">
              <span class="system-emoji">${meta.emoji || meta.icon}</span>
              <span class="system-text">
                <strong>${EduPortal.escapeHtml(meta.label)}</strong>
                <small>${EduPortal.escapeHtml(meta.tagline || "")} · ${EduPortal.escapeHtml(role)}</small>
              </span>
              <span class="system-arrow">→</span>
            </button>`;
        }).join("");
        list.querySelectorAll(".system-option").forEach(btn => {
          btn.addEventListener("click", () => goToSystem(btn.dataset.system));
        });
        picker.classList.remove("hidden");
      }

      function redirectAfterLogin() {
        const next = EduPortal.qs("next");
        const sysHint = EduPortal.qs("system");
        const user = EduPortal.getUser() || {};
        const systems = user.systems || [];

        // An explicit ?system= hint the user actually has wins outright.
        if (sysHint && EduPortal.userHasSystem(sysHint)) {
          goToSystem(sysHint);
          return;
        }
        // Honour a safe ?next= deep-link back into the portal.
        if (next && next.startsWith("/portal/")) {
          location.href = next;
          return;
        }
        // Route by system access.
        if (systems.length === 1) {
          goToSystem(systems[0].system_key);   // one system → straight in
        } else if (systems.length > 1) {
          showSystemPicker(systems);            // many → let them choose
        } else {
          // No system access — the dashboard shows a friendly "ask an admin".
          location.href = "/portal/dashboard.html";
        }
      }

      // Password visibility toggle
      const pwToggle = document.getElementById("pw-toggle");
      pwToggle.addEventListener("click", () => {
        const input = document.getElementById("password");
        if (input.type === "password") { input.type = "text"; pwToggle.textContent = "Hide"; }
        else { input.type = "password"; pwToggle.textContent = "Show"; }
      });

      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        clearError();
        btn.disabled = true;
        btn.textContent = "Signing in...";
        try {
          const data = await EduPortal.apiFetch("/auth/login", {
            method: "POST",
            skipAuth: true,
            body: {
              username: document.getElementById("username").value.trim(),
              password: document.getElementById("password").value,
            },
          });

          if (data.mfa_required) {
            mfaToken = data.mfa_token;
            form.classList.add("hidden");
            mfaForm.classList.remove("hidden");
            document.getElementById("mfa-code").focus();
            return;
          }

          EduPortal.saveAuth(data.token, data.refresh_token, data.user);
          redirectAfterLogin();
        } catch (e) {
          showError(e.message || "Login failed");
          btn.disabled = false;
          btn.textContent = "Sign in";
        }
      });

      mfaForm.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        clearError();
        const submitBtn = document.getElementById("mfa-submit");
        submitBtn.disabled = true;
        submitBtn.textContent = "Verifying...";
        try {
          const res = await fetch(EduPortal.API_BASE + "/auth/mfa/verify", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + mfaToken,
            },
            body: JSON.stringify({ code: document.getElementById("mfa-code").value.trim() }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "MFA failed");
          EduPortal.saveAuth(data.token, data.refresh_token, data.user);
          redirectAfterLogin();
        } catch (e) {
          showError(e.message || "MFA failed");
          submitBtn.disabled = false;
          submitBtn.textContent = "Verify";
        }
      });

      // If already signed in, jump to dashboard
      if (EduPortal.getToken() && EduPortal.getUser()) {
        redirectAfterLogin();
      }
    })();
  </script>
</body>
</html>
